[package]
name = "mousarchy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
dirs = "6"
env_logger = "0.11.11"
futures = "0.3.34"
if-addrs = "0.15.0"
input-capture = { version = "0.4", default-features = false }
input-event = "0.4"
log = "0.4.35"
socket2 = { version = "0.6", features = ["all"] }
mousarchy-protocolo = { version = "0.1.0", path = "../mousarchy-protocolo" }
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
# the Linux backends of the capture (the Windows one has no feature)
input-capture = { version = "0.4", features = ["layer_shell", "x11", "libei"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation"] }
