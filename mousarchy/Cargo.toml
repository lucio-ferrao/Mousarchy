[package]
name = "mousarchy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
dirs = "6"
env_logger = "0.11.11"
futures = "0.3.34"
if-addrs = "0.15.0"
input-capture = "0.4"
input-event = "0.4"
log = "0.4.35"
mousarchy-protocolo = { version = "0.1.0", path = "../mousarchy-protocolo" }
tokio = { version = "1.54.1", features = ["full"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
